<style>
:root{--bg:#F5F7FF;--surface:#FFFFFF;--surface-2:#E9EEFC;--ink:#101B3D;--ink-2:#3F4A6B;--ink-3:#566186;--line:#DCE3F7;--brand:#1B3FA0;--brand-strong:#142F7A;--brand-soft:#E2E8FB;--brand-line:#B8C6F0;--promo:#C81E35;--promo-soft:#FDE8EB;--zap:#177A42;--zap-ink:#FFFFFF;--band:#0E1A47;--on-band:#F1F4FF;--on-band-2:#AAB6DC;--band-line:#25346E;--band-accent:#FFC727;--btn:#1B3FA0;--btn-ink:#FFFFFF;--focus:#2563EB;--shadow:0 1px 2px rgb(16 27 61/.05),0 12px 32px -16px rgb(16 27 61/.22);--map-bg:#EAEFFB;--map-street:#FFFFFF;--map-road:#FFFFFF;--map-edge:#CBD5EF;--map-green:#D6EBDD;--map-water:#D2E1F7;--logo-a:#1B3FA0;--logo-b:#101B3D}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,h4{font-family:Nunito,system-ui,sans-serif;font-weight:800;letter-spacing:-.015em;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}a{color:inherit}button{font:inherit;color:inherit}
[hidden]{display:none!important}
body:not(.mode-emp) .only-emp,.mode-emp .only-casa{display:none!important}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.skip{position:absolute;left:12px;top:-60px;z-index:99;background:var(--btn);color:var(--btn-ink);padding:10px 14px;border-radius:10px}
.skip:focus{top:12px}
.eyebrow{font:600 .72rem/1.2 Nunito,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.14em;color:var(--brand)}
.display{font-size:clamp(2.4rem,1.5rem + 4vw,4.2rem);line-height:1.04}
.lede{font-size:1.125rem;color:var(--ink-2);max-width:34em}
.muted{color:var(--ink-3)}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid transparent;background:var(--btn);color:var(--btn-ink);font-weight:600;text-decoration:none;cursor:pointer;transition:transform .2s,border-color .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-sec:hover{border-color:var(--ink-3)}
.btn-zap{background:var(--zap);color:var(--zap-ink)}
.btn-soft{background:var(--brand-soft);color:var(--brand-strong)}
.btn-sm{min-height:38px;padding:0 14px;font-size:.9rem}
.btn-full{width:100%}
.link{color:var(--brand);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer}
.link:hover{text-decoration:underline}
.link .ico{width:16px;height:16px}
/* barra do protótipo */
.proto{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:.85rem;color:var(--ink-2)}
.proto>summary{cursor:pointer;list-style:none;padding-block:8px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.proto>summary::-webkit-details-marker{display:none}
.proto summary b{color:var(--ink)}
.proto .u{color:var(--brand);font-weight:600;text-decoration:underline}
/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:900 1.3rem/1 Nunito,system-ui,sans-serif;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}

.lw{display:flex;flex-direction:column;gap:3px}
.lw b{font-weight:900;color:var(--logo-a)}
.lw span{font:800 .56em/1 Nunito,system-ui,sans-serif;letter-spacing:.02em;color:var(--logo-b);border-bottom:2px solid #FFC727;padding-bottom:2px;align-self:flex-start}
.search{flex:1;max-width:440px;position:relative;display:flex;align-items:center;margin:0}
.search>.ico{position:absolute;left:14px;color:var(--ink-3);pointer-events:none}
.search .in{padding-left:42px;border-radius:999px;min-height:42px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:.85rem;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.l-short{display:none}
.lista-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:42px;padding:0 14px;font-weight:600;cursor:pointer}
.badge{min-width:20px;height:20px;border-radius:999px;background:var(--brand);color:var(--bg);font-size:.72rem;font-weight:700;display:inline-grid;place-items:center;padding:0 5px;line-height:1}
.badge[data-count="0"]{display:none}
.nav{display:flex;gap:4px;padding-bottom:8px;overflow-x:auto;scrollbar-width:none}
.nav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:.92rem;white-space:nowrap;cursor:pointer}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.bbar{display:none}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:var(--shadow)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9rem;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* campos */
.in{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.in:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
textarea.in{min-height:110px;resize:vertical}
input[type="color"].in{padding:4px;height:46px;cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-weight:600;font-size:.9rem}
.field small{color:var(--ink-3);font-size:.8rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer}
.chk input,.opt input{accent-color:var(--brand);width:17px;height:17px;margin:0;flex:none}
.err{color:var(--promo);font-size:.9rem;margin:0;padding-left:18px}
/* seções */
.sec{padding-block:64px}
.sec-tint{background:var(--surface-2)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;margin-bottom:28px}
.sec-head>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.sec-head h2{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.3rem)}
.sec-head p{color:var(--ink-2)}
.pg-head{padding-block:40px 24px;display:flex;flex-direction:column;gap:12px}
.pg-head h1{font-size:clamp(2rem,1.4rem + 2.6vw,3.2rem);max-width:20em}
.pg-head .lede{max-width:40em}
.crumbs{font-size:.85rem;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;padding-top:24px}
.crumbs a{color:var(--ink-2);text-decoration:none;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.page:not(#pg-inicio){padding-bottom:72px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center;padding-block:56px 40px}
.hero-txt{display:flex;flex-direction:column;gap:20px;min-width:0}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.hero-addr{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:.92rem}
.hero-addr .ico{color:var(--brand);width:18px;height:18px}
.hero-art{--tile:var(--brand-soft);position:relative;aspect-ratio:1/1;width:100%;max-width:100%}
.ha-bg{position:absolute;inset:6% 8% 0;background:var(--brand-soft);border-radius:999px 999px 28px 28px}
.ha-p{position:absolute;bottom:4%;--c2:color-mix(in oklab,var(--c) 18%,#fff);--cap:color-mix(in oklab,var(--c) 55%,#0d2230)}
.ha-p svg{width:100%;height:auto;display:block}
.ha-1{left:16%;width:34%}.ha-2{left:46%;width:24%;bottom:5%}.ha-3{left:66%;width:21%}
#ha-note{position:absolute;top:12%;left:0;background:var(--surface);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);font-size:.85rem;display:flex;flex-direction:column;gap:2px;max-width:60%}
#ha-note b{font-weight:600}
#ha-note .p{display:flex;gap:8px;align-items:baseline}
#ha-note s{color:var(--ink-3);font-size:.8rem}
#ha-note .on{color:var(--promo);font-weight:700;font-size:1.05rem}
.ha-chip{position:absolute;right:0;top:46%;background:var(--surface);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);font-size:.82rem;font-weight:600;display:flex;gap:8px;align-items:center}
.ha-chip .ico{color:var(--brand);width:16px;height:16px}
.trust{list-style:none;margin:0;padding:22px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;border-block:1px solid var(--line)}
.trust li{display:flex;gap:12px;align-items:flex-start;font-size:.9rem;color:var(--ink-2);line-height:1.4}
.trust b{display:block;color:var(--ink);font-weight:600}
.trust .ico{color:var(--brand);margin-top:1px}
.deps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.dep{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;cursor:pointer;transition:border-color .2s,transform .2s}
.dep:hover{border-color:var(--brand-line);transform:translateY(-2px)}
.dep .ico{color:var(--brand);width:24px;height:24px}
.dep b{font-weight:600}
.dep span{font-size:.8rem;color:var(--ink-3);line-height:1.4}
/* cards de produto */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 20px}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile{--tile:color-mix(in oklab,var(--c) 12%,var(--surface));--c2:color-mix(in oklab,var(--c) 18%,#fff);--cap:color-mix(in oklab,var(--c) 55%,#0d2230);background:var(--tile);position:relative;aspect-ratio:1/1;max-width:100%;border-radius:18px;display:grid;place-items:center;overflow:hidden}
.tile svg{width:44%;height:auto;transition:transform .3s}
.card .tile{cursor:pointer;margin-bottom:6px}
.card:hover .tile svg{transform:translateY(-4px)}
.off{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--promo);font-size:.75rem;font-weight:700;line-height:1;padding:6px 9px;border-radius:999px}
.marca{font-size:.72rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.card .nm{font-weight:600;text-decoration:none;line-height:1.3;cursor:pointer}
.card .nm:hover{text-decoration:underline}
.tam{font-size:.85rem;color:var(--ink-3)}
.price{display:flex;flex-direction:column;line-height:1.25}
.price .de{font-size:.8rem;color:var(--ink-3)}
.price .por{font-weight:700;font-size:1.25rem;color:var(--ink)}
.price .por.on{color:var(--promo)}
.price .por small{font-size:.75rem;font-weight:500;color:var(--ink-3);margin-right:4px}
.acts{margin-top:auto;padding-top:6px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;justify-content:space-between;background:var(--surface)}
.stepper button{width:40px;height:40px;border:0;background:none;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.stepper button:hover{background:var(--surface-2)}
.stepper .ico{width:16px;height:16px}
.stepper output{font-weight:600;font-size:.9rem;text-align:center}
.acts .btn{width:100%}
.empty{padding:48px 24px;text-align:center;border:1px dashed var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:12px;grid-column:1/-1;color:var(--ink-2)}
/* faixa empresas */
.band{background:var(--band);color:var(--on-band)}
.band .eyebrow{color:var(--band-accent)}
.band-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:40px;align-items:center}
.band-in>div:first-child{display:flex;flex-direction:column;gap:16px}
.band h2{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.3rem)}
.band p{color:var(--on-band-2)}
.band .btn{background:var(--on-band);color:var(--band);align-self:flex-start}
.kits-mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kitp{display:flex;flex-direction:column;gap:4px;padding:18px;border:1px solid var(--band-line);border-radius:16px;text-decoration:none;cursor:pointer;transition:border-color .2s}
.kitp:hover{border-color:var(--band-accent)}
.kitp b{font-weight:600}
.kitp small{color:var(--on-band-2);line-height:1.4}
.kitp .v{color:var(--band-accent);font-weight:700;margin-top:6px}
/* passos */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;list-style:none;padding:0;margin:0;counter-reset:s}
.steps.s4{grid-template-columns:repeat(4,minmax(0,1fr))}
.steps li{padding:24px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);font:800 1.6rem/1 Nunito,system-ui,sans-serif;color:var(--brand)}
.steps b{font-weight:600}
.steps p{color:var(--ink-2);font-size:.95rem}
/* guias */
.gcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.gcard{display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;cursor:pointer;transition:border-color .2s}
.gcard:hover{border-color:var(--brand-line)}
.g-ico{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center}
.gcard .meta{font-size:.8rem;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.gcard h3{font-size:1.25rem}
.gcard p{color:var(--ink-2);font-size:.95rem}
.gcard .link{margin-top:auto}
/* mapa e loja */
.loja-t{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:center}
.loja-t>div:last-child{display:flex;flex-direction:column;gap:14px}
.mapa{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--map-bg)}
.mapa svg{display:block;width:100%;height:auto}
.mapa-nota{font-size:.78rem;color:var(--ink-3);margin-top:8px}
.m-st{fill:none;stroke:var(--map-street);stroke-width:6;stroke-linecap:round}
.m-edge{fill:none;stroke:var(--map-edge);stroke-width:20;stroke-linecap:round}
.m-road{fill:none;stroke:var(--map-road);stroke-width:14;stroke-linecap:round}
.m-lbl{font:600 11px Nunito,sans-serif;letter-spacing:.14em;fill:var(--ink-3)}
.m-rd{font:600 10px Nunito,sans-serif;letter-spacing:.06em;fill:var(--ink-2)}
.m-b{font:800 15px Nunito,system-ui,sans-serif;fill:var(--ink)}
.m-s{font:500 11px Nunito,sans-serif;fill:var(--ink-2)}
.loja-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.lcards{display:grid;gap:14px}
.lcard{padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lcard h3{font:600 .75rem/1.2 Nunito,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.lcard h3 .ico{color:var(--brand);width:18px;height:18px}
address{font-style:normal}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bairro-form{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.bairro-form .in{flex:1 1 220px;min-width:0}
.res{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-top:12px;display:flex;flex-direction:column;gap:10px}
.bairros{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;list-style:none;padding:0}
.bairros li{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
/* catálogo */
.cat{display:grid;grid-template-columns:240px minmax(0,1fr);gap:36px;align-items:start}
.filtros{position:sticky;top:calc(124px + env(safe-area-inset-top,0px))}
#f-box>summary{list-style:none;cursor:pointer}
#f-box>summary::-webkit-details-marker{display:none}
.fgroup{border:0;margin:0 0 18px;padding:0 0 18px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);min-width:0}
.fgroup legend{font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);padding:0;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:10px;font-size:.93rem;cursor:pointer;padding:3px 0}
.opt .n{margin-left:auto;color:var(--ink-3);font-size:.8rem}
.cat-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cat-bar select.in{width:auto;min-height:40px;padding:6px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brand-line);background:var(--brand-soft);color:var(--brand-strong);border-radius:999px;padding:5px 8px 5px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.chip .ico{width:14px;height:14px}
.chip.clear{background:none;border-color:transparent;color:var(--ink-2);text-decoration:underline}
/* produto */
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start;padding-block:16px 40px}
.pd-art{position:sticky;top:calc(124px + env(safe-area-inset-top,0px));border-radius:24px}
.pd-art svg{width:40%}
.pd-info{display:flex;flex-direction:column;gap:16px;min-width:0}
.pd-h{font-size:clamp(1.8rem,1.3rem + 2vw,2.6rem)}
.pd-desc{color:var(--ink-2);max-width:36em}
.pd .price .por{font-size:2rem}
.pd-save{font-size:.9rem;color:var(--ink-2)}
.pd-buy{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pd-buy .stepper{width:150px}
#pd-sum{font-weight:600}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{padding:14px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--ink-3)}
.acc details[open] summary::after{content:"−"}
.acc-b{padding:0 0 16px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px}
/* empresas */
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.perk{padding:22px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.perk .ico{color:var(--brand);width:24px;height:24px}
.perk b{font-weight:600;line-height:1.3}
.perk p{color:var(--ink-2);font-size:.92rem}
#kits,#cotacao{scroll-margin-top:140px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.kit{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px}
.tbl-wrap{overflow-x:auto;min-width:0}
.tbl{width:100%;border-collapse:collapse;min-width:480px;font-size:.93rem}
.tbl th{text-align:left;font-weight:600;color:var(--ink-3);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right;white-space:nowrap}
.tbl s{color:var(--ink-3);font-size:.82rem}
@media (max-width:560px){.tbl{min-width:0;font-size:.88rem}.tbl s{display:block}.tbl th.r{white-space:normal}.tbl th,.tbl td{padding-left:6px;padding-right:6px}}
.kit-tot{display:flex;flex-direction:column;gap:10px;justify-content:center}
.kit-tot .big{font-weight:700;font-size:2rem;line-height:1.1}
.kit-tot .eco{color:var(--brand);font-weight:600}
.cot{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:18px}
.cot pre,.l-prev pre{white-space:pre-wrap;word-break:break-word;font:.82rem/1.5 ui-monospace,Consolas,monospace;background:var(--surface-2);padding:12px;border-radius:12px;margin:0}
/* guia */
.guia{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;align-items:start;padding-block:16px 40px}
.art-txt{display:flex;flex-direction:column;gap:18px;max-width:42em;min-width:0}
.art-txt h1{font-size:clamp(2rem,1.4rem + 2.4vw,3rem)}
.art-txt h2{font-size:1.5rem;margin-top:12px}
.passos{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:14px}
.passos li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;align-items:start}
.passos li::before{counter-increment:p;content:counter(p);width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-weight:700}
.box{padding:16px 18px;border-radius:14px;display:flex;gap:12px;font-size:.95rem;line-height:1.5}
.box.dica{background:var(--brand-soft)}.box.dica .ico{color:var(--brand)}
.box.alerta{background:var(--promo-soft)}.box.alerta .ico{color:var(--promo)}
.box.info{background:var(--surface-2)}.box.info .ico{color:var(--ink-2)}
.precisa{position:sticky;top:calc(124px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.precisa h2{font-size:1.2rem}
.mini{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;text-decoration:none;cursor:pointer}
.mini .tile{width:52px;border-radius:12px}
.mini .tile svg{width:52%}
.mini b{font-size:.92rem;font-weight:600;display:block;line-height:1.3}
.mini small{color:var(--ink-3);font-size:.8rem}
.mini .r{font-weight:600;font-size:.92rem;white-space:nowrap}
.tudo{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;font-weight:600}
/* testamos */
.bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;min-width:100px}
.bar i{display:block;height:100%;width:var(--v);background:var(--brand);border-radius:inherit}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-strong);font-size:.72rem;font-weight:700;white-space:nowrap}
.t-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:40px;align-items:start}
/* painel */
.adm{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:36px;align-items:start}
.adm-form{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:18px}
.adm-prev{position:sticky;top:calc(124px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:20px;background:var(--surface-2)}
.adm-prev .card{max-width:260px}
/* lista (dialog) */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:22px;width:min(560px,calc(100% - 32px));max-height:min(88vh,860px);box-shadow:var(--shadow)}

.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:1.4rem}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer}
.dlg-body{overflow:auto;min-height:0;padding:8px 20px 22px;display:flex;flex-direction:column;gap:16px}
#l-vazio{padding:32px 0;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--ink-2)}
#l-cheia{display:flex;flex-direction:column;gap:16px}
#l-itens{list-style:none;margin:0;padding:0}
.li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li .tile{width:56px;border-radius:12px}
.li .tile svg{width:52%}
.li-n{font-weight:600;line-height:1.3}
.li-m{font-size:.82rem;color:var(--ink-3)}
.li-m s{margin-right:4px}
.li-ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.li .stepper{width:124px}

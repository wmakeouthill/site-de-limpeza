[project]
name = "falcao-limpeza-backend"
version = "0.1.0"
description = "Backend API and CMS for Falcão Limpeza"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "azure-storage-blob>=12.25.0,<13.0.0",
    "email-validator>=2.0.0,<3.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pillow>=11.0.0,<13.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pyjwt[crypto]>=2.10.0,<3.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.40,<3.0.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]



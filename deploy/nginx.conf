# Site no nginx do host. O deploy.ps1 -Setup troca __DOMAIN__/__SERVER_NAMES__ e o certbot --nginx
# acrescenta o bloco HTTPS (443) e o redirect do 80.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    # Uploads do CMS vão até 6 MiB (limite do BFF).
    client_max_body_size 7m;

    location / {
        # www (domínio real) vai para o canônico: o Astro só aceita o host de PUBLIC_SITE_BASE_URL.
        # Fica no location, não no server: o desafio do certbot (/.well-known) não pode ser redirecionado.
        if ($host != __DOMAIN__) { return 301 https://__DOMAIN__$request_uri; }
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        # O Astro valida o Host contra security.allowedDomains e usa o proto para a checagem de origem.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
